[package]
name = "whytui"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "cookies","blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util"] }
serde_json = "1.0"

dirs = "6.0.0"
rand = "0.9.2"
colored = "2.1"
urlencoding = "2.1.3"
crossterm = "0.29.0"

sha1 = "0.10"
hex = "0.4"

unicode-width = "0.1" #distinguesh japanese chars to make text centered
unicode-normalization = "0.1"
base64 = "0.22.1" #decode  flac url
lofty = { version = "0.22.4", default-features = false } #adding metadata to .opus and .flac
# ratatui = "0.29"

# Already in the tree via crossterm, so this costs no extra build time. Needed for two things std
# cannot express: tying mpv/ffmpeg's lifetime to ours (PR_SET_PDEATHSIG) so killing whytui cannot
# leave music playing, and catching SIGTERM/SIGHUP/SIGINT so the terminal is restored on the way out.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
